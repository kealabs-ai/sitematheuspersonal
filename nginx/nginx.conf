server {
    listen 80;
    server_name matheuspersonal.com.br www.matheuspersonal.com.br;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    resolver 8.8.8.8 ipv6=off;

    # Proxy para API - roteia para o servidor de microserviços
    location /api/ {
        proxy_pass https://srv1023256.hstgr.cloud/api;
        proxy_http_version 1.1;
        proxy_set_header Host srv1023256.hstgr.cloud;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            return 204;
        }
    }

    # Frontend React - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

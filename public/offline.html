<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Matheus Personal</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020408; color: #fff; font-family: Inter, Arial, sans-serif; }
      main { max-width: 420px; margin: 20px; text-align: center; }
      h1 { color: #84cc16; text-transform: uppercase; }
      p { color: #d1d5db; line-height: 1.6; }
      button { border: 0; background: #84cc16; color: #000; font-weight: 700; padding: 14px 22px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>Os dados da sua conta precisam de conexão para permanecer atualizados. Reconecte-se à internet para continuar.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
